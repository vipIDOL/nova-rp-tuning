<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — страница не найдена · NOVA RP Auto Tuning</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080908">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:32px;text-align:center;
    background:
      radial-gradient(760px 480px at 80% -10%, rgba(240,178,0,.12), transparent 60%),
      radial-gradient(700px 460px at 0% 40%, rgba(240,178,0,.06), transparent 60%),
      #080908;
    color:#F1F1EA;font-family:'Manrope','Segoe UI',Arial,sans-serif;
  }
  .card{max-width:540px}
  .code{font-size:clamp(76px,18vw,148px);font-weight:800;letter-spacing:-.06em;line-height:1;color:#F0B200}
  h1{margin:12px 0 10px;font-size:clamp(22px,4vw,30px);letter-spacing:-.02em}
  p{margin:0 0 28px;color:#9B9F93;font-size:15px;line-height:1.55}
  a{display:inline-block;padding:13px 24px;border-radius:11px;background:#F3F3EC;color:#0C0D0A;font-weight:800;font-size:14px;text-decoration:none;transition:transform .18s,background .18s}
  a:hover{transform:translateY(-1px);background:#fff}
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела. Вернитесь к калькулятору — он на месте.</p>
    <a href="./">На главную</a>
  </main>
</body>
</html>
